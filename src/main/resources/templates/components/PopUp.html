<div th:fragment="popup">
  <!-- Global Tooltip Container -->
  <div id="victus-global-popup"
    class="fixed hidden p-3 bg-[#f3ffe5] border-2 border-[#4A6E18] text-zinc-900 text-sm font-bold rounded-lg shadow-[4px_4px_0px_0px_#4A6E18] z-[9999] pointer-events-none whitespace-normal break-all w-max max-w-[250px] sm:max-w-[350px] transition-opacity duration-200 opacity-0">
    <div id="victus-global-popup-text"></div>
    <div id="victus-global-popup-arrow"
      class="absolute -bottom-2 left-1/2 -translate-x-1/2 w-3 h-3 bg-[#f3ffe5] border-b-2 border-r-2 border-[#4A6E18] rotate-45">
    </div>
  </div>

  <script>
    (function () {
      if (window.victusPopupInitialized) return;
      window.victusPopupInitialized = true;

      const popup = document.getElementById('victus-global-popup');
      const popupText = document.getElementById('victus-global-popup-text');
      const popupArrow = document.getElementById('victus-global-popup-arrow');

      function hidePopup() {
        if (!popup) return;
        popup.style.opacity = '0';
        setTimeout(() => {
          if (popup.style.opacity === '0') popup.classList.add('hidden');
        }, 200);
      }

      function showPopup(trigger, textContent) {
        if (!trigger) return;
        
        // Verifica se o texto está truncado ou se o tooltip é forçado
        const isTruncated = trigger.scrollWidth > trigger.clientWidth;
        const forceTooltip = trigger.getAttribute('data-force-tooltip') === 'true' || trigger.closest('.tooltip-group').getAttribute('data-force-tooltip') === 'true';
        if (!isTruncated && !forceTooltip) {
          hidePopup();
          return;
        }

        popupText.textContent = textContent;
        popup.classList.remove('hidden');

        const rect = trigger.getBoundingClientRect();

        requestAnimationFrame(() => {
          const popupHeight = popup.offsetHeight;
          const popupWidth = popup.offsetWidth;

          let top = rect.top - popupHeight - 12;
          let left = rect.left + (rect.width / 2) - (popupWidth / 2);

          if (left < 10) left = 10;
          if (left + popupWidth > window.innerWidth - 10) {
            left = window.innerWidth - popupWidth - 10;
          }

          if (top < 10) {
            top = rect.bottom + 12;
            popupArrow.classList.remove("-bottom-2", "border-b-2", "border-r-2");
            popupArrow.classList.add("-top-2", "border-t-2", "border-l-2");
          } else {
            popupArrow.classList.remove("-top-2", "border-t-2", "border-l-2");
            popupArrow.classList.add("-bottom-2", "border-b-2", "border-r-2");
          }

          popup.style.top = `${top}px`;
          popup.style.left = `${left}px`;
          popup.style.opacity = '1';
        });
      }

      const isTouch = window.matchMedia("(pointer: coarse)").matches;

      // Handle Clicks (para mobile, tudo vira click. Para desktop, apenas os marcados com click)
      document.addEventListener('click', (e) => {
        const group = e.target.closest('.tooltip-group');
        
        if (group) {
          if (isTouch || group.dataset.tooltipTrigger === 'click') {
            const textEl = group.querySelector('.tooltip-text-target') || group;
            if (textEl) showPopup(textEl, group.getAttribute('data-fullname') || textEl.textContent);
            return;
          }
        }
        
        hidePopup();
      });

      // Hover support (apenas para desktop)
      if (!isTouch) {
        document.addEventListener('mouseover', (e) => {
          const group = e.target.closest('.tooltip-group');
          if (group && group.dataset.tooltipTrigger !== 'click') {
            const textEl = group.querySelector('.tooltip-text-target') || group;
            if (textEl) showPopup(textEl, group.getAttribute('data-fullname') || textEl.textContent);
          }
        });
        document.addEventListener('mouseout', (e) => {
          const group = e.target.closest('.tooltip-group');
          if (!group) hidePopup();
        });
      }

      document.addEventListener('scroll', hidePopup, { passive: true });
    })();
  </script>
</div>
